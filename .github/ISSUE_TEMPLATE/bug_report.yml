name: Bug report
description: Report a reproducible bug in Emoji Picker for macOS.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.
        Please fill in as much detail as possible so we can reproduce quickly.

  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: macos_version
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 15.2"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Please provide a minimal reproducible sequence.
      placeholder: |
        1. Open ...
        2. Type ...
        3. Press ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots / logs / recordings (optional)
      description: Drag and drop files or paste details here.
